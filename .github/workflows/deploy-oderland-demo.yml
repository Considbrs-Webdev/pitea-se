name: Deploy - Oderland demo

on:
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: Git ref to build and deploy (Municipio 7 branch)
        required: true
        default: municipio-6
        type: string

env:
  PHP_VERSION: ${{ vars.PHP_VERSION }}

concurrency:
  group: oderland-demo
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      YOAST_COMPOSER_TOKEN: ${{ secrets.YOAST_COMPOSER_TOKEN }}

    steps:
      - name: Refuse production refs
        run: |
          case "${{ inputs.deploy_ref }}" in
            master|main|stage)
              echo "::error::Refusing to deploy '${{ inputs.deploy_ref }}' to the Oderland demo. Use municipio-6."
              exit 1
              ;;
          esac
        shell: bash

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.deploy_ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24.11.1

      - name: Setup PHP with composer v2
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Cache composer packages
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Combine composer.json and composer.local.json
        run: php ./composer-local-merge.php pre-install
        shell: bash

      - name: Validate Yoast Premium auth
        if: env.YOAST_COMPOSER_TOKEN == ''
        run: |
          if grep -q '"yoast/wordpress-seo-premium"' composer.local.json; then
            echo "::error::YOAST_COMPOSER_TOKEN secret is required when yoast/wordpress-seo-premium is enabled in composer.local.json."
            exit 1
          fi
        shell: bash

      - name: Configure Composer auth for Yoast Premium
        if: env.YOAST_COMPOSER_TOKEN != ''
        run: composer config --global --auth http-basic.my.yoast.com token
          "$YOAST_COMPOSER_TOKEN"
        shell: bash

      - name: Install composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
          --optimize-autoloader --classmap-authoritative
        shell: bash

      - name: Write composer versions info file
        run: composer show > composer.versions.md
        shell: bash

      - name: Inject npm token (optional)
        run: |
          echo "@helsingborg-stad:registry=https://npm.pkg.github.com/helsingborg-stad" >> ~/.npmrc
          echo "@awesome.me:registry=https://npm.fontawesome.com/" >> ~/.npmrc
          echo "@fortawesome:registry=https://npm.fontawesome.com/" >> ~/.npmrc
          echo "//npm.fontawesome.com/:_authToken=${{ secrets.FONTAWESOME_TOKEN }}" >> ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> ~/.npmrc
        shell: bash

      - name: Download ACF plugin
        run: |
          wget "${{ secrets.ACF_URL }}" -O acf.zip
          unzip -q acf.zip -d wp-content/plugins/
          rm -f acf.zip
        shell: bash

      - name: Execute build scripts
        run: php ./build.php --cleanup --no-composer-in-child-packages --install-npm
        shell: bash

      - name: Cleanup .npmrc
        run: rm -f ~/.npmrc
        shell: bash

      - name: Create release tarball
        run: bash ./scripts/create-artifact.sh
        shell: bash

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-package
          path: release.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: oderland-demo
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.deploy_ref }}

      - name: Download workflow artifact
        uses: actions/download-artifact@v8
        with:
          name: release-package
          path: .

      - name: Verify artifact exists
        run: ls -lah release.tar.gz
        shell: bash

      - name: Configure SSH
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "${ODERLAND_SSH_PRIVATE_KEY}" | sed 's/\r$//' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          PORT="${ODERLAND_SSH_PORT:-22}"
          KEYSCAN_OUT=$(ssh-keyscan -p "$PORT" -T 30 "$ODERLAND_SSH_HOST" 2>/dev/null || true)
          if [ -z "$KEYSCAN_OUT" ]; then
            echo "::error::ssh-keyscan returned no host keys for ${ODERLAND_SSH_HOST} port ${PORT}."
            exit 1
          fi
          printf '%s\n' "$KEYSCAN_OUT" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
        env:
          ODERLAND_SSH_PRIVATE_KEY: ${{ secrets.ODERLAND_SSH_PRIVATE_KEY }}
          ODERLAND_SSH_HOST: ${{ secrets.ODERLAND_SSH_HOST }}
          ODERLAND_SSH_PORT: ${{ secrets.ODERLAND_SSH_PORT }}

      - name: Upload release artifact
        run: |
          set -euo pipefail
          PORT="${ODERLAND_SSH_PORT:-22}"
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o IdentitiesOnly=yes \
            "${ODERLAND_SSH_USER}@${ODERLAND_SSH_HOST}" \
            'mkdir -p /home/considbrs/.oderland-demo-deploy'
          scp -i ~/.ssh/deploy_key -P "$PORT" -o IdentitiesOnly=yes \
            release.tar.gz \
            "${ODERLAND_SSH_USER}@${ODERLAND_SSH_HOST}:/home/considbrs/.oderland-demo-deploy/release.tar.gz"
          scp -i ~/.ssh/deploy_key -P "$PORT" -o IdentitiesOnly=yes \
            scripts/deploy-oderland-demo.sh \
            "${ODERLAND_SSH_USER}@${ODERLAND_SSH_HOST}:/home/considbrs/.oderland-demo-deploy/deploy-oderland-demo.sh"
        env:
          ODERLAND_SSH_HOST: ${{ secrets.ODERLAND_SSH_HOST }}
          ODERLAND_SSH_USER: ${{ secrets.ODERLAND_SSH_USER }}
          ODERLAND_SSH_PORT: ${{ secrets.ODERLAND_SSH_PORT }}

      - name: Run demo deploy on server
        run: |
          set -euo pipefail
          PORT="${ODERLAND_SSH_PORT:-22}"
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o IdentitiesOnly=yes \
            "${ODERLAND_SSH_USER}@${ODERLAND_SSH_HOST}" \
            'chmod 700 /home/considbrs/.oderland-demo-deploy/deploy-oderland-demo.sh && bash /home/considbrs/.oderland-demo-deploy/deploy-oderland-demo.sh /home/considbrs/.oderland-demo-deploy/release.tar.gz && rm -f /home/considbrs/.oderland-demo-deploy/release.tar.gz'
        env:
          ODERLAND_SSH_HOST: ${{ secrets.ODERLAND_SSH_HOST }}
          ODERLAND_SSH_USER: ${{ secrets.ODERLAND_SSH_USER }}
          ODERLAND_SSH_PORT: ${{ secrets.ODERLAND_SSH_PORT }}
